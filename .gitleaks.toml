# Gitleaks configuration — allowlist for false positives and historical findings
# https://github.com/gitleaks/gitleaks#configuration

title = "Muhabbet Gitleaks Config"

# Keep gitleaks' built-in rules. A config file that defines no rules and does not extend the defaults
# REPLACES them with nothing: until this block was added, gitleaks loaded this file, ran zero rules and
# reported "no leaks found" on every scan. Verified with gitleaks 8.24.3 against a synthetic
# provider-format key: no finding with the old file, a finding without it.
[extend]
  useDefault = true

# Generic credentials. Provider-pattern scanning (GitHub's and gitleaks' defaults) looks for
# recognisable token formats. A database or object-store password is just a random string, so neither
# notices one committed as `SOMETHING_PASSWORD=...`. This rule flags a *_PASSWORD or *_SECRET name
# assigned a literal, high-entropy value in ANY file, documentation included. A reference such as
# ${DB_PASSWORD} or ${{ secrets.X }} is not a literal and does not match.
[[rules]]
  id = "muhabbet-generic-password-assignment"
  description = "A *_PASSWORD or *_SECRET name assigned a literal value"
  # Upper-case names only: the environment-variable and compose style in which these leaks have
  # actually been committed. Matching case-insensitively flags every `passwordEncoder = ...` in Kotlin.
  regex = '''\b[A-Z0-9_]*(?:PASSWORD|SECRET)[A-Z0-9_]*["']?[ \t]*[=:][ \t]*["']?([^\s"'$<>{}]{12,})'''
  secretGroup = 1
  entropy = 3.5
  keywords = ["password", "secret"]
  [rules.allowlist]
    # Obvious placeholders in examples and dev defaults.
    stopwords = ["change", "example", "placeholder", "your", "dummy", "minioadmin"]

[allowlist]
  description = "Global allowlist"

  # Historical .env.prod (CICD-06). It was committed in 29874bcb (2026-03-16) and untracked in
  # 3925f708 (2026-03-28) while the repository is PUBLIC, so every value in it is treated as burned.
  # This allowlist is scoped to the one commit that added it, NOT to the path: a path allowlist would
  # also silence any future .env.prod commit, which is exactly the leak gitleaks exists to catch.
  # Rotation status lives in docs/process/security-incident-2026-11-env-prod.md — keep this comment
  # in step with it ("rotation: PENDING" until the owner records otherwise).
  # rotation: PENDING (owner action, see incident record)
  commits = [
    "29874bcb427090177c9bf738fe1dc2ec9eca3d2e",
  ]

  # Allowlist specific commits/fingerprints for false positives
  regexTarget = "match"
  regexes = [
    # GIPHY public beta key — well-known, non-secret
    '''dc6zaTOxFJmzC''',
    # Placeholder ACCESS_TOKEN in docs — anchored so it no longer suppresses any finding that merely
    # contains the substring (the unanchored form silenced real tokens too).
    '''^ACCESS_TOKEN$''',
    # Example JWT fragment in API contract docs
    '''bmV3IHJlZnJlc2g\.\.\.''',
    # RFC 6455 WebSocket example key
    '''dGhlIHNhbXBsZSBub25jZQ==''',
    # Test fixtures: the two JWT signing secrets the test suite configures, each as the whole value
    # (start of match or a delimiter before it, optional closing quote, then end of match), and a fixed
    # invite token. A bare `test-secret-` prefix would suppress any real value that starts with it.
    '''(?:^|[\s"'=:])test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256["']?$''',
    '''(?:^|[\s"'=:])test-secret-that-is-long-enough-for-hs256-signing-1234567890["']?$''',
    '''7wDcQmVUmvvcJmBLtSPu3xX2Bd0Cq1Yb1kQ9dfNfR8k''',
    '''GK0123456789abcdef01234567''',
    # The README's curl example with the literal placeholder (the match is the whole command).
    '''Bearer ACCESS_TOKEN"''',
    # Prose in the multi-transport design (sad.md erasure table), matched by the generic key rule.
    # Anchored to the exact match text so a real value on the same line is still reported.
    '''^keys, relay/custody $''',
  ]
