spring:
  # Local-only credentials that match infra/docker-compose.yml. They live here, not in
  # application.yml, so that no other profile can fall back to them.
  datasource:
    password: ${DB_PASSWORD:muhabbet_dev}
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    # Dev only: lets an already-applied migration file be edited without the app refusing to
    # start. Never set this in application.yml or application-prod.yml — see #429.
    validate-on-migrate: false

logging:
  level:
    com.muhabbet: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Dev overrides
muhabbet:
  media:
    minio:
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
  otp:
    mock-enabled: true  # Logs OTP to console instead of sending SMS
  fcm:
    enabled: false      # No push notifications in dev
