spring:
  application:
    name: muhabbet-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:muhabbet}
    username: ${DB_USERNAME:muhabbet}
    password: ${DB_PASSWORD:muhabbet_dev}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10               # Keep more connections warm to avoid creation spikes
      connection-timeout: 5000       # Fail fast under load (was 10s)
      idle-timeout: 600000           # 10 minutes
      max-lifetime: 1800000          # 30 minutes
      leak-detection-threshold: 60000  # Alert if connection held >60s

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema — Hibernate only validates
    open-in-view: false   # Disable OSIV anti-pattern
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25             # Batch inserts/updates (delivery statuses, members)
          fetch_size: 50             # JDBC fetch size for cursor-based results
        order_inserts: true          # Group INSERTs by entity type for better batching
        order_updates: true          # Group UPDATEs by entity type for better batching
        query:
          in_clause_parameter_padding: true  # Pad IN clause params to powers of 2 (better plan caching)

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # validate-on-migrate defaults to true here on purpose — this file is what production runs.
    # It is relaxed only in application-dev.yml (local iteration) and application-test.yml
    # (each test class builds Postgres fresh from these files via Testcontainers, so there is
    # nothing to diverge, but the override keeps local dev/test behavior consistent).

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000

  # Jackson (Jackson 3.x in Spring Boot 4.x — dates are ISO-8601 by default)
  jackson:
    default-property-inclusion: non_null

  # Servlet
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

# Server
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200               # Match Hetzner VPS (2 vCPU)
      min-spare: 10          # Keep 10 threads warm
    accept-count: 100        # Queue size before rejecting connections
    connection-timeout: 20000  # 20s timeout for slow clients
    keep-alive-timeout: 60000  # HTTP keep-alive 60s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # when-authorized alone means "any authenticated principal". JwtAuthFilter grants an ordinary
      # user an authenticated token with zero authorities, so before this line every logged-in user
      # could read the database vendor, the Redis version and the host's free disk bytes off
      # /actuator/health (#494). Named roles narrow that to admin tokens, which are real: V21 added
      # users.is_admin and both login paths and the refresh path carry it into the claim.
      roles: ADMIN
      probes:
        # Spring Boot 4 enables the liveness/readiness groups on every platform, not just on
        # Kubernetes as 2.x and 3.x did (AvailabilityProbesAutoConfiguration is
        # @ConditionalOnBooleanProperty(..., matchIfMissing = true)). The effect here was that
        # /actuator/health advertised "groups":["liveness","readiness"] while SecurityConfig permits
        # the exact path "/actuator/health" only, so both sub-paths answered 401 forever — an
        # invitation to point a probe at something that cannot work. Nothing uses them: the compose
        # healthcheck and the deploy gate both poll the aggregate. Turned off rather than opened up,
        # because widening the matcher to /actuator/health/** would expose the per-component paths
        # too. If this ever runs on Kubernetes, enable them, widen the matcher, and put db and redis
        # into the readiness group — its default membership is readinessState alone, which would
        # report ready with the database down.
        enabled: false
      status:
        # Position in this list IS the precedence: SimpleStatusAggregator keeps only the statuses
        # named here and takes the lowest-ranked one. MEDIA_UNAVAILABLE sits after UP so a MinIO
        # outage stays visible on this endpoint without taking the aggregate with it — restarting
        # the backend does not fix MinIO, and neither does reverting the release, so it must not
        # fail the container healthcheck or the deploy gate. Moving it up next to DOWN would do
        # exactly that. HealthStatusOrderTest drives the real aggregator with this list and fails
        # if the ranking is ever inverted.
        order: DOWN,OUT_OF_SERVICE,UP,MEDIA_UNAVAILABLE,UNKNOWN
        http-mapping:
          # This block REPLACES the built-in mapping, it does not extend it — which is the opposite
          # of the `order` list above, and the reason DOWN and OUT_OF_SERVICE have to be written out
          # here even though both are Spring defaults. HttpCodeStatusMapper.of() falls back to
          # SimpleHttpCodeStatusMapper.DEFAULT_MAPPINGS only when this map is EMPTY; give it any
          # entry at all and the lookup becomes getOrDefault(code, 200) over these entries alone.
          #
          # So listing MEDIA_UNAVAILABLE by itself silently dropped DOWN -> 503, and /actuator/health
          # answered 200 with a body saying DOWN. Both gates read the status code and nothing else
          # (`curl -sf` in deploy-hetzner.yml, `curl -f` in the compose healthcheck, both piped to
          # /dev/null), so a release with a dead database would have passed the gate that exists to
          # catch precisely that, and the container would have kept being reported healthy.
          # HealthHttpStatusMappingTest drives the real mapper with this block and fails if either
          # failure mapping goes missing again.
          DOWN: 503
          OUT_OF_SERVICE: 503
          # 200 is also what an unlisted status would get; stated explicitly because it is a
          # decision (#494) and not a fallback — a MinIO outage must not fail a deploy.
          MEDIA_UNAVAILABLE: 200
  metrics:
    tags:
      application: muhabbet

# App-specific configuration
muhabbet:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-256-bits-long-key-here}
    access-token-expiry: 900         # 15 minutes in seconds
    refresh-token-expiry: 2592000    # 30 days in seconds
    issuer: muhabbet

  otp:
    length: 6
    expiry-seconds: 300              # 5 minutes
    max-attempts: 5
    cooldown-seconds: 60
    mock-enabled: ${OTP_MOCK_ENABLED:false}  # true = log OTP to console instead of SMS

  # Two-step verification: the sign-in gate's guess budget (#566). See TwoStepProperties.
  two-step:
    max-attempts: 5
    lock-seconds: 900                # 15 minutes, then the window reopens

  sms:
    provider: ${SMS_PROVIDER:mock}     # mock, twilio, twilio-verify, netgsm
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
      verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
    netgsm:
      usercode: ${NETGSM_USERCODE:}
      password: ${NETGSM_PASSWORD:}
      msgheader: ${NETGSM_HEADER:MUHABBET}
      api-url: https://api.netgsm.com.tr

  media:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:muhabbet-media}
    retention-days: 30
    max-image-size: 10485760         # 10 MB
    max-video-size: 104857600        # 100 MB
    thumbnail-width: 320
    thumbnail-height: 320
    # Origins other than our own MinIO that a message or status may point media at (#679). The
    # defaults are GIPHY's CDN hosts, because the GIF/sticker picker sends a URL straight off it and
    # never re-hosts the file — without them the send path would refuse every GIF. See
    # MediaProperties.attachmentOrigins for why a closed list of third parties does not reopen the
    # issue. Override to add a host; the list replaces the default, so include GIPHY if you still
    # want GIFs.
    attachment-origins: ${MEDIA_ATTACHMENT_ORIGINS:https://media.giphy.com,https://media0.giphy.com,https://media1.giphy.com,https://media2.giphy.com,https://media3.giphy.com,https://media4.giphy.com,https://i.giphy.com,https://stickers.giphy.com}

  invite:
    # Base of the shareable group invite URL the server puts in InviteLinkResponse.inviteUrl.
    # Matches the app link the Android manifest claims (https://muhabbet.app/invite/...), so a
    # phone with Muhabbet installed opens it in the app. Change this when the real domain lands.
    base-url: ${INVITE_LINK_BASE_URL:https://muhabbet.app/invite}

  multi-device:
    # Tier-2 linked-device endpoints. DEFAULT false = single-device path unchanged; the QR
    # link / list / revoke endpoints return 403 until flipped. Kill-switch is this flag (no
    # redeploy needed if it is surfaced via env). Per-device Signal session transfer is a
    # separate, still-blocked crypto slice (see DeviceLinkCrypto / CLAUDE.md libsignal block).
    enabled: ${MULTI_DEVICE_ENABLED:false}

  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}   # Service account JSON, or empty for GCP ADC

  fcm:
    credentials-path: ${FCM_CREDENTIALS_PATH:}
    enabled: ${FCM_ENABLED:false}

  websocket:
    heartbeat-interval-seconds: 30
    heartbeat-timeout-seconds: 90

  livekit:
    enabled: ${LIVEKIT_ENABLED:false}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    server-url: ${LIVEKIT_SERVER_URL:}

# Logging
logging:
  level:
    com.muhabbet: INFO   # Safe default; dev profile (application-dev.yml) raises this to DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
