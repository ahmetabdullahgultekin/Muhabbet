# Push notification text — English bundle. See notification-messages.properties for the rules.
#
# Reached when a device registers "en" on its push token (devices.locale, V22). Until that column
# landed this file was unreachable and every notification went out in Turkish, which is the second
# half of #469.

push.sender.unknown=Unknown
# {0} = sender name, {1} = group name
push.title.group={0} · {1}

push.content.TEXT=💬 Message
push.content.IMAGE=📷 Photo
push.content.VIDEO=🎥 Video
push.content.VOICE=🎙️ Voice message
push.content.DOCUMENT=📄 Document
push.content.LOCATION=📍 Location
push.content.CONTACT=👤 Contact
push.content.POLL=📊 Poll
push.content.STICKER=🧩 Sticker
push.content.GIF=🎬 GIF
