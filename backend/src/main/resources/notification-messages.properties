# Push notification text — DEFAULT bundle (Turkish).
#
# Server-generated user-visible strings. They belong here rather than in Kotlin for the same reason
# the app's strings live in strings.xml: the reader's language is not the writer's (#469).
#
# The basename is "notification-messages", NOT "messages", on purpose: Spring Boot's
# MessageSourceAutoConfiguration only triggers on "messages", so keeping this name means the bean
# in NotificationTextConfig is the only MessageSource in the context and nothing is ambiguous.
#
# Every ContentType must have a push.content.<TYPE> key in EVERY bundle —
# NotificationTextCatalogTest fails the build if one is missing, because a missing key would only
# surface as a dropped push in production.

push.sender.unknown=Bilinmeyen
# {0} = sender name, {1} = group name
push.title.group={0} · {1}

push.content.TEXT=💬 Mesaj
push.content.IMAGE=📷 Fotoğraf
push.content.VIDEO=🎥 Video
push.content.VOICE=🎙️ Sesli mesaj
push.content.DOCUMENT=📄 Belge
push.content.LOCATION=📍 Konum
push.content.CONTACT=👤 Kişi
push.content.POLL=📊 Anket
push.content.STICKER=🧩 Çıkartma
push.content.GIF=🎬 GIF
