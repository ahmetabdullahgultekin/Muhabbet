spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Off for the same reason as application-dev.yml (#429) — not because these tests need it:
    # each class builds Postgres fresh from these files via Testcontainers, so checksums can't
    # actually drift here.
    validate-on-migrate: false

muhabbet:
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256
    access-token-expiry: 900
    refresh-token-expiry: 2592000
    issuer: muhabbet-test
  otp:
    length: 6
    expiry-seconds: 300
    max-attempts: 5
    cooldown-seconds: 60
    mock-enabled: true
  rate-limit:
    # Every test in a @SpringBootTest class shares one client IP and one filter instance, so the
    # production 10/min budget is spent by the class rather than by any single test. Raised here so
    # the OTP attempt-limit tests can make their attempts; the limit itself is covered separately.
    max-requests: 1000
    window-seconds: 60

logging:
  level:
    com.muhabbet: DEBUG
