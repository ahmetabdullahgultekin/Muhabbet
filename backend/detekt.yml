# `maxIssues` sat at the top level here until #279. detekt 1.23 expects it under `build:`, and with
# `config.validation` on (the default) an unknown top-level key is not ignored — it aborts the run.
# So this file was doubly inert: the threshold was never applied, and once the Kotlin mismatch that
# masked it was fixed, detekt refused to start until the key moved. Zero is correct now that
# `detekt-baseline.xml` holds the pre-existing findings: everything already there is exempt, and
# anything new fails the build.
build:
  maxIssues: 0

# The default config suppresses ProjectStatisticsReport and ComplexityReport. Both are on here for
# one reason: they make the run print how many files it scanned, so a run that analysed nothing can
# no longer be mistaken for a run that found nothing. That mistake is the whole of #279 — for months
# a crashed detekt and a clean detekt produced the same green tick. If the output has no
# "number of kt files:" line, the result means nothing.
console-reports:
  active: true
  exclude:
    - 'NotificationReport'
    - 'FindingsReport'

complexity:
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12
  CyclomaticComplexMethod:
    threshold: 15
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 15
    thresholdInInterfaces: 10
  LargeClass:
    threshold: 500

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    maxLineLength: 150
  ReturnCount:
    max: 5
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    active: true

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*|`.*`'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*|log|logger'

potential-bugs:
  UnsafeCast:
    active: true
  UselessPostfixExpression:
    active: true

performance:
  SpreadOperator:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
