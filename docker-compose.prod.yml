services:
  muhabbet-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: muhabbet-backend
    restart: unless-stopped
    # The JVM runs as PID 1 and does not reap orphans, so every curl from the healthcheck below
    # became a permanent zombie. identity-core-api has 42 of them after 64 days; this container only
    # escaped because it restarts often (#462). init also makes SIGTERM reach the app, so shutdown
    # is clean and @PreDestroy actually runs — the WebSocket session cleanup depends on it.
    init: true
    environment:
      # The image's ENTRYPOINT is a bare `java -jar`, so without this the JVM took every
      # default: 25% of the container limit as max heap (192 MB of 768 MB) and SerialGC.
      # Measured at 93.7 MiB live in a 128 MiB old gen — 73% full with six users and no
      # load at all. #489 has the numbers.
      #
      # MaxRAMPercentage over -Xmx so the heap follows the limit above if it is ever
      # changed again. G1 is stated explicitly rather than left to the server-class
      # heuristic, so a future limit change cannot silently drop back to SerialGC.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+ExitOnOutOfMemoryError
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: shared-postgres
      DB_PORT: 5432
      DB_NAME: muhabbet
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: shared-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: http://shared-minio:9000
      # Presigned URLs are signed against MINIO_ENDPOINT and then rewritten to this
      # host, so the Traefik route behind it must forward the signed host upstream
      # (cdn-muhabbet sets passHostHeader=false). Without this the app hands clients
      # a shared-minio:9000 URL that only resolves inside Docker.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://cdn-muhabbet.116.203.222.213.nip.io}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: muhabbet-media
      # SMS_PROVIDER selects the OtpSender/OtpVerifier implementation: mock (default, writes the
      # code to the log), netgsm, twilio (Messages API, needs a purchased number) or twilio-verify
      # (no number needed). These live here because THIS is the compose that deploys —
      # infra/docker-compose.prod.yml is the legacy nginx stack and setting them there does nothing.
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      NETGSM_USERCODE: ${NETGSM_USERCODE:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      # Comma-separated numbers whose OTP is generated locally and written to this container's log
      # instead of being sent, so an emulator can sign in at all (#436). Empty here on purpose: the
      # list is a deployment decision, set in .env.prod, not a property of the repository. The
      # backend refuses to start unless every entry is in the unallocated +90500 range.
      MUHABBET_OTP_TESTNUMBERS: ${MUHABBET_OTP_TESTNUMBERS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Was hardcoded "false", so push could not be switched on without editing the image. The
      # credentials it needs were a placeholder file until 2026-08-16 (#458), which is why nothing
      # noticed. Still defaults to false: turning it on is a deployment decision made in .env.prod.
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_CREDENTIALS_PATH: /app/firebase-adminsdk.json
      CORS_ALLOWED_ORIGINS: https://muhabbet.rollingcatsoftware.com
    volumes:
      - ./firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.muhabbet-api.rule=Host(`muhabbet-api.rollingcatsoftware.com`)"
      - "traefik.http.routers.muhabbet-api.entrypoints=websecure"
      - "traefik.http.routers.muhabbet-api.tls.certresolver=letsencrypt"
      # Rate limiting at the edge as well as in the app. The in-process filter resets on every
      # deploy, is per-instance, and only covers /api/v1/auth/** — so it smooths bursts against one
      # endpoint rather than bounding load. Traefik sees the real client address and survives
      # restarts. Generous on purpose: a chat client legitimately makes many requests, so this is a
      # ceiling on abuse, not a throttle on use. The cost ceiling that actually protects the Twilio
      # bill is the per-hour and per-number quota in the backend (#440).
      - "traefik.http.middlewares.muhabbet-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.muhabbet-ratelimit.ratelimit.burst=120"
      - "traefik.http.middlewares.muhabbet-ratelimit.ratelimit.period=1m"
      - "traefik.http.routers.muhabbet-api.middlewares=secure-headers@file,muhabbet-ratelimit"
      - "traefik.http.services.muhabbet-api.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          # Was 768M, which the container sat at 81% of while idle with six users
          # (623 MiB measured). More importantly it put the JVM below the 1792 MB
          # threshold at which HotSpot classes a machine as "server", so it picked
          # SerialGC — single-threaded and stop-the-world over the whole old gen,
          # which on a WebSocket server means every connected socket freezes at once.
          # See #489 for the measurements.
          #
          # The host has ~10 GB available and every other service here is well under
          # its own limit, so this is headroom that already exists rather than a bet.
          memory: 2G

  # Initialize MinIO bucket for Muhabbet media
  minio-init:
    image: minio/mc:latest
    container_name: muhabbet-minio-init
    depends_on:
      muhabbet-backend:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://shared-minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_ROOT_PASSWORD};
      mc mb local/muhabbet-media --ignore-existing;
      mc anonymous set download local/muhabbet-media/thumbnails;
      echo 'MinIO bucket initialized.';
      "
    networks:
      - backend
    restart: "no"

networks:
  backend:
    name: backend
    external: true
  proxy:
    name: proxy
    external: true
