# nginx server block for the muhabbet-site container (docker-compose.prod.yml mounts this over the
# image's /etc/nginx/conf.d/default.conf). It lives outside docs/site/ so it is not itself served.
#
# Two things the stock config cannot do:
#   - /invite/<token>: every group invite link points here. There is one page for all of them, and
#     the token must never be needed to find it.
#   - /.well-known/assetlinks.json: Android verifies the app link only if this answers 200 with
#     Content-Type application/json and no redirect.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Behind Traefik nginx sees plain http on port 80; a relative Location keeps a directory
    # redirect (/invite -> /invite/) on the https origin the browser used.
    absolute_redirect off;

    # Invite tokens are bearer credentials for joining a group. Keep them out of the access log.
    location ^~ /invite/ {
        access_log off;
        try_files /invite/index.html =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # Nothing else under the dot-directory is published.
    location ^~ /.well-known/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
