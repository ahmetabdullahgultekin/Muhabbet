# Dependency updates.
#
# WHAT WAS WRONG WITH THE OLD CONFIGURATION
#
# One group called `all-dependencies` containing every update type, aimed at the default branch.
# Two things followed from that, and both of them hurt:
#
#   1. One bad bump held every good bump hostage. #564 grouped four updates, of which exactly one
#      was unmergeable — `androidx.core:core-ktx` 1.19.0 requires `compileSdk 37` and this project
#      is on 36 — so the whole pull request was unmergeable, and the three healthy bumps had to be
#      extracted into #675 by hand. That is not a one-off: of the ten dependency pull requests
#      Dependabot has opened here, NINE were closed unmerged, several of them carrying 37 to 42
#      updates each. A pull request nobody can review is a pull request nobody merges.
#
#   2. They all targeted `main`. `main` is the release branch — feature work goes to `dev` and is
#      batched to `main` at release time — so a dependency bump landing directly on `main` puts it
#      ahead of `dev` and requires an approving review that a solo engineer cannot give on a pull
#      request opened against a protected branch.
#
# WHAT THIS DOES INSTEAD
#
#   - Everything targets `dev`, like every other change in this repository.
#   - PATCH updates are grouped into one pull request. They are the high-volume, low-risk half of the
#     traffic, so one pull request a week is the right amount of them to read.
#   - MINOR and MAJOR updates are NOT grouped. Each gets its own pull request, so the #564 failure
#     mode — one unmergeable bump blocking three mergeable ones — cannot happen again by
#     construction.
#
# NOTHING IS MERGED AUTOMATICALLY (F16/F24). The workflow that auto-merged patch bumps was deleted:
# a dependency bump runs third-party build code (Gradle plugins, the wrapper distribution) at
# configuration time, and with automatic merging that code reached `dev` without a person ever
# reading the bump. Every Dependabot pull request is merged by a human. Do not reintroduce
# auto-merge while CI runs on persistent self-hosted runners.

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Istanbul"
    # Raised from 5 because minor and major updates now arrive one per pull request instead of in a
    # single bundle. In practice the patch group closes itself every week, so this ceiling is a
    # backstop rather than a weekly reality.
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "type:chore"
    groups:
      # The only group. Patch bumps are individually boring and collectively noisy, which is exactly
      # what a group is for.
      gradle-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
    ignore:
      # 1.19.0 raises the compileSdk floor to 37; mobile/composeApp/build.gradle.kts sets 36, and
      # the module pins 1.18.0 (mobile/designsystem/build.gradle.kts). Without this line Dependabot
      # re-opens the same unmergeable pull request every Monday — it already did, twice.
      # DELETE THIS ENTRY when compileSdk reaches 37.
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]

  # Every `uses:` is pinned to a full commit SHA with a `# vX.Y.Z` comment (F35). Dependabot updates
  # both the SHA and the comment, which is what keeps the pins from going stale.
  #
  # infra/scripts/seed-runner-action-cache.sh pre-extracts each action into the self-hosted runner's
  # cache so jobs stop downloading from codeload (#563). It reads the SHAs from the workflows, so a
  # bump merged here names a new SHA the cache does not have yet; the runner downloads it on first
  # use, or the script seeds it on its next run.
  #
  # Monthly, not weekly: actions move slowly and each bump is read by a person before it merges.
  # After merging an action bump, re-run the seed script on the runner so the new SHA is cached
  # before a 429 day needs it. These are never auto-merged.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "area:ci"
