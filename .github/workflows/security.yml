name: Security & Quality

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'Dockerfile*'
      - '.github/workflows/security.yml'
      - '.gitleaks.toml'
      - 'infra/scripts/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'Dockerfile*'
      - '.gitleaks.toml'
      - 'infra/scripts/**'
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  SKIP_MOBILE: 'true'

jobs:
  # --- Dependency Vulnerability Scan ---
  dependency-check:
    name: Dependency Scan
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Generate Gradle dependency list
        run: ./gradlew :backend:dependencies --configuration runtimeClasspath > backend-deps.txt

      # Only on failure, and briefly. The account's artifact storage quota is exhausted, so an
      # unconditional upload fails the job after the scan itself has already succeeded — the same
      # fault that was making Backend CI red on green builds.
      # `continue-on-error` as well as `failure()` (#599). Gating on failure stops this turning a
      # green scan red, but it did not stop a quota error from ADDING a second, misleading failure
      # to a job that had already failed for a real reason. An artifact upload should never be
      # part of the verdict.
      - name: Upload dependency list
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dependency-list
          path: backend-deps.txt
          retention-days: 1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # --- Docker Image Scan ---
  docker-scan:
    name: Docker Image Scan
    runs-on: [self-hosted, linux, x64]
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: muhabbet-backend:scan
          cache-from: type=gha

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'muhabbet-backend:scan'
          format: 'sarif'
          output: 'docker-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'docker-trivy-results.sarif'

  # --- Secret Scanning ---
  secrets-scan:
    name: Secret Detection
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's SARIF upload is what fails here, not the scan. It derives its root
          # directory from $HOME (/home/deploy) while the workspace is under
          # /opt/actions-runner-muhabbet, and dies with "The rootDirectory: /home/deploy is not a
          # parent directory of the file: …/results.sarif". So a clean scan still reported failure,
          # which has made this check meaningless for months — indistinguishable from a real leak.
          # The findings are in the step's own output; the artifact adds nothing and also costs
          # quota that is already exhausted.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # --- CodeQL Analysis ---
  codeql:
    name: CodeQL Analysis
    runs-on: [self-hosted, linux, x64]
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build for CodeQL
        run: ./gradlew :backend:assemble :shared:jvmJar

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin'
