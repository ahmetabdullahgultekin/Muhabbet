name: Security & Quality

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'Dockerfile*'
      - '.github/workflows/security.yml'
      - 'infra/scripts/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'Dockerfile*'
      - 'infra/scripts/**'
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  SKIP_MOBILE: 'true'

jobs:
  # --- Dependency Vulnerability Scan ---
  dependency-check:
    name: Dependency Scan
    runs-on: [self-hosted, linux, x64]
    # Backstop for CICD-01, not the fix: a fork PR runs workflow files from its own head and can delete
    # this line. The fix is the repo setting 'Require approval for all outside collaborators' and, structurally,
    # no PR job on a persistent runner (ADR 0031). See docs/process/security-incident-2026-11-env-prod.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true

      - name: Generate Gradle dependency list
        run: ./gradlew :backend:dependencies --configuration runtimeClasspath > backend-deps.txt

      # Only on failure, and briefly. The account's artifact storage quota is exhausted, so an
      # unconditional upload fails the job after the scan itself has already succeeded — the same
      # fault that was making Backend CI red on green builds.
      # `continue-on-error` as well as `failure()` (#599). Gating on failure stops this turning a
      # green scan red, but it did not stop a quota error from ADDING a second, misleading failure
      # to a job that had already failed for a real reason. An artifact upload should never be
      # part of the verdict.
      - name: Upload dependency list
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-list
          path: backend-deps.txt
          retention-days: 1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 — pinned after the March 2026 Trivy supply-chain compromise (CICD-05)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # --- Docker Image Scan ---
  docker-scan:
    name: Docker Image Scan
    runs-on: [self-hosted, linux, x64]
    # Backstop for CICD-01, not the fix: a fork PR runs workflow files from its own head and can delete
    # this line. The fix is the repo setting 'Require approval for all outside collaborators' and, structurally,
    # no PR job on a persistent runner (ADR 0031). See docs/process/security-incident-2026-11-env-prod.md.
    if: (github.event_name != 'schedule') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: muhabbet-backend:scan
          cache-from: type=gha

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 — pinned after the March 2026 Trivy supply-chain compromise (CICD-05)
        with:
          image-ref: 'muhabbet-backend:scan'
          format: 'sarif'
          output: 'docker-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        if: always()
        with:
          sarif_file: 'docker-trivy-results.sarif'

  # Secret scanning moved to secret-scan.yml (F25): it must run on every branch and every path,
  # which this workflow's triggers deliberately do not.

  # --- CodeQL Analysis ---
  codeql:
    name: CodeQL Analysis
    runs-on: [self-hosted, linux, x64]
    # Backstop for CICD-01, not the fix: a fork PR runs workflow files from its own head and can delete
    # this line. The fix is the repo setting 'Require approval for all outside collaborators' and, structurally,
    # no PR job on a persistent runner (ADR 0031). See docs/process/security-incident-2026-11-env-prod.md.
    if: (github.event_name != 'schedule') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: java-kotlin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true

      - name: Build for CodeQL
        run: ./gradlew :backend:assemble :shared:jvmJar

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: '/language:java-kotlin'
