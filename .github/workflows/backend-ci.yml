name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_MOBILE: 'true'
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  # --- Build & Test ---
  build-and-test:
    name: Build & Test
    runs-on: [self-hosted, linux, x64]

    # No `services:` block on purpose.
    #
    # The runner is the production host, so `shared-postgres` and `shared-redis` already own 5432
    # and 6379. Service containers bound to those ports never started — "Bind for 127.0.0.1:5432
    # failed: port is already allocated" — and the tests fell through to the *production* Redis,
    # which is password-protected and refused them. Every @SpringBootTest then died at context
    # startup rather than on an assertion.
    #
    # Every integration test now brings its own Postgres and Redis via Testcontainers, on random
    # ports, so nothing here needs a shared instance. Do not reintroduce these while CI runs on the
    # production host.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Build shared module
        run: ./gradlew :shared:jvmJar

      - name: Build backend
        run: ./gradlew :backend:assemble

      - name: Run tests
        run: ./gradlew :backend:test
        # DB_HOST / REDIS_HOST are deliberately absent. Every integration test supplies its own
        # Testcontainers instance through @DynamicPropertySource; pointing these at localhost aimed
        # them at the production Postgres and Redis running on this same host, which is how the
        # suite ended up authenticating against production Redis and failing at context startup.
        # Leaving them set would be a live trap: a test that fell back to the default datasource
        # would silently reach production.
        env:
          SPRING_PROFILES_ACTIVE: test
          OTP_MOCK_ENABLED: 'true'
          FCM_ENABLED: 'false'
          FIREBASE_ENABLED: 'false'

      - name: Generate JaCoCo coverage report
        run: ./gradlew :backend:jacocoTestReport
        if: always()

      - name: Verify code coverage thresholds
        run: ./gradlew :backend:jacocoTestCoverageVerification
        continue-on-error: true

      - name: Run detekt static analysis
        run: ./gradlew :backend:detekt
        if: always()
        continue-on-error: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/
          retention-days: 3

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/build/reports/jacoco/
          retention-days: 3

      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: backend/build/reports/detekt/
          retention-days: 3

      - name: Publish test report
        if: always() && github.event_name == 'pull_request'
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'backend/build/test-results/test/*.xml'
          check_name: 'Backend Test Results'

      - name: Add coverage to PR comment
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: backend/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 30
          min-coverage-changed-files: 60
          title: 'Backend Code Coverage'

  # --- Docker Build ---
  docker:
    name: Docker Build
    runs-on: [self-hosted, linux, x64]
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: muhabbet-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
