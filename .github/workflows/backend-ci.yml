name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    # `dev` is the working branch: every feature branch is merged here first and only
    # batched to `main` at release time. Until this was added, NO CI ran on any pull
    # request into `dev` (#487) — `develop` does not exist in this repo, so the filter
    # matched nothing. Two PRs that were each green in isolation were merged and broke
    # each other, and it was only caught at release. The backend suite is the cheap,
    # high-value gate, so it runs here.
    #
    # There is deliberately NO `paths:` filter here any more. A filter on the trigger does not make
    # an irrelevant pull request cheap — it stops the workflow from STARTING, so GitHub never creates
    # the "Build & Test" check run at all. #682 and #683 changed only documentation and carried zero
    # checks. A check that is sometimes not created can never be a *required* check: GitHub holds
    # such a pull request at "Expected — waiting for status to be reported" forever. And without a
    # required check, a red pull request merges — which is how `dev` was broken on 2026-08-21.
    #
    # The filtering moved INTO the job: see the "Decide what this pull request needs" step below.
    # The check run now always exists, and a pull request that touches no backend source reports
    # green in well under a minute.
    branches: [main, dev, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_MOBILE: 'true'
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  # --- Build & Test ---
  build-and-test:
    name: Build & Test
    runs-on: [self-hosted, linux, x64]

    # No `services:` block on purpose.
    #
    # The runner is the production host, so `shared-postgres` and `shared-redis` already own 5432
    # and 6379. Service containers bound to those ports never started — "Bind for 127.0.0.1:5432
    # failed: port is already allocated" — and the tests fell through to the *production* Redis,
    # which is password-protected and refused them. Every @SpringBootTest then died at context
    # startup rather than on an assertion.
    #
    # Every integration test now brings its own Postgres and Redis via Testcontainers, on random
    # ports, so nothing here needs a shared instance. Do not reintroduce these while CI runs on the
    # production host.
    steps:
      - uses: actions/checkout@v4

      # The `paths:` filter that used to sit on the trigger lives here now. Every step below that
      # costs more than a few seconds is gated on this output, so the check run is always created
      # (and can therefore be required on a branch) while an unrelated pull request still finishes
      # in seconds. See .github/scripts/paths-changed.sh for the full reasoning.
      #
      # The prefix list is the old `paths:` filter plus `gradle.properties`, which affects this
      # build and was only ever listed by Mobile CI. `.github/workflows/backend-ci.yml` is
      # deliberately NOT in the list — it was not in the old filter either, and there is one
      # self-hosted runner, so making every edit of this file run the whole suite would queue behind
      # the deploys it delays. Add it if that trade stops being worth it.
      - name: Decide what this pull request needs
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          backend=$(bash .github/scripts/paths-changed.sh \
            backend/ \
            shared/ \
            build.gradle.kts \
            settings.gradle.kts \
            gradle.properties \
            gradle/)
          case "$backend" in
            true|false) ;;
            *)
              # A silent "false" would turn every pull request green without running a single test,
              # which is worse than any build failure. Refuse to continue on an answer we cannot read.
              echo "paths-changed.sh returned '$backend'; expected true or false" >&2
              exit 1
              ;;
          esac
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          if [ "$backend" = "true" ]; then
            echo "Backend, shared or Gradle sources changed — building and running the suite." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No backend, shared or Gradle sources changed — build and tests skipped, check reports green." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.changes.outputs.backend == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Build shared module
        if: steps.changes.outputs.backend == 'true'
        run: ./gradlew :shared:jvmJar

      - name: Build backend
        if: steps.changes.outputs.backend == 'true'
        run: ./gradlew :backend:assemble

      - name: Run tests
        if: steps.changes.outputs.backend == 'true'
        run: ./gradlew :backend:test
        # DB_HOST / REDIS_HOST are deliberately absent. Every integration test supplies its own
        # Testcontainers instance through @DynamicPropertySource; pointing these at localhost aimed
        # them at the production Postgres and Redis running on this same host, which is how the
        # suite ended up authenticating against production Redis and failing at context startup.
        # Leaving them set would be a live trap: a test that fell back to the default datasource
        # would silently reach production.
        env:
          SPRING_PROFILES_ACTIVE: test
          OTP_MOCK_ENABLED: 'true'
          FCM_ENABLED: 'false'
          FIREBASE_ENABLED: 'false'

      - name: Generate JaCoCo coverage report
        run: ./gradlew :backend:jacocoTestReport
        if: always() && steps.changes.outputs.backend == 'true'

      - name: Verify code coverage thresholds
        if: steps.changes.outputs.backend == 'true'
        run: ./gradlew :backend:jacocoTestCoverageVerification
        continue-on-error: true

      # Blocking, deliberately (#279). This step carried `continue-on-error: true` for months while
      # detekt was not running at all — it died at startup on a Kotlin version mismatch, and an
      # ignored crash and a clean run produce the identical green tick. The pre-existing findings are
      # frozen in `backend/detekt-baseline.xml`, so this can only go red on something the branch
      # introduced. If it does go red, fix the finding or argue it into `detekt.yml`; do not
      # regenerate the baseline to bury it, and do not put `continue-on-error` back.
      #
      # Gated on the same `changes.backend` output as every other expensive step, and for the same
      # reason: the gate belongs on the STEP, never on the workflow trigger. Skipping the step still
      # produces the "Build & Test" check run, so this check stays requirable on a branch; a
      # docs-only pull request neither pays for a detekt run nor waits forever on a check that was
      # never created. `always()` is kept so a failing test run does not hide a new finding — the
      # two failures are independent and both should be visible in one run.
      - name: Run detekt static analysis
        run: ./gradlew :backend:detekt
        if: always() && steps.changes.outputs.backend == 'true'

      # The primary test report, and the only one that is not subject to the artifact quota (#599).
      #
      # When the quota is full `actions/upload-artifact` fails outright, so on the day this
      # mattered most there was NO readable report on the run page at all — finding out which
      # tests had failed meant reading backend/build/test-results/test/*.xml off the runner's
      # working directory by hand. Retention limits and narrower paths slow the quota refilling;
      # they do nothing once it is already full. The step summary always renders.
      #
      # It also covers a case the artifacts never did: `mikepenz/action-junit-report` below only
      # runs on `pull_request`, so a push to `main` — the thing that gates the deploy — had no
      # readable report even when uploads worked.
      #
      # `always()` and never failing: this reports, it does not gate. The test step is the gate.
      - name: Summarise test results
        if: always() && steps.changes.outputs.backend == 'true'
        run: bash .github/scripts/junit-summary.sh backend/build/test-results/test >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------------------------
      # Artifacts below are now a convenience on top of that summary, not the only way to read a
      # run. Three things changed for #599:
      #
      #   1. `continue-on-error: true` everywhere. "Artifact storage quota has been hit" is an
      #      account-level condition with nothing to do with the code, and it was failing jobs
      #      whose actual work had already succeeded. mobile-ci.yml already reasoned its way to
      #      this; backend-ci had not caught up.
      #   2. The XML, not the generated HTML. Measured on this suite (1071 tests):
      #        reports/tests/                     4.9 MB, 611 files  (a generated website)
      #        test-results/test/*.xml            1.8 MB, 225 files  (what tools actually parse)
      #        reports/jacoco/                    7.7 MB
      #        reports/jacoco/.../jacocoTestReport.xml  948 KB  (the file the comment below reads)
      #      12.6 MB down to 2.7 MB per run, before retention. The JUnit reporter below, the
      #      summary above and any IDE all read the XML; nobody opens the HTML site.
      #   3. One day of retention. Three days of a report nobody opened is what the quota was
      #      being spent on, and a failure is investigated the same day or not at all.
      #
      # Kept at `failure()`: a green run's report is the one least likely to be read.
      #
      # What is NOT automated here, deliberately: purging the existing backlog. Retention only
      # governs artifacts created from now on, so the stored ones — mostly ~128 MB debug APKs,
      # 3.10 GB of a 3.13 GB account total — expire on the retention they were uploaded with.
      # That is a one-time cleanup, and a scheduled job that deletes artifacts is a destructive
      # automation nobody can test before it runs for real. Do it by hand, once:
      #
      #   gh api --paginate /repos/{owner}/{repo}/actions/artifacts --jq \
      #     '.artifacts[] | select(.expired == false) | "\(.id) \(.name) \(.size_in_bytes)"'
      #   gh api -X DELETE /repos/{owner}/{repo}/actions/artifacts/<id>
      #
      # (Or the Actions storage page.) Usage is recalculated every 6–12 hours, so the quota does
      # not clear the moment the last delete returns.
      # ---------------------------------------------------------------------------------------
      - name: Upload test results
        if: failure() && steps.changes.outputs.backend == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          # *.xml, not the directory. `test-results/test/` also holds `binary/`, Gradle's raw
          # event stream (every line of stdout and stderr from every test), which is by far the
          # largest thing in there and which nothing reads.
          path: backend/build/test-results/test/*.xml
          retention-days: 1

      - name: Upload JaCoCo coverage report
        if: failure() && steps.changes.outputs.backend == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 1

      # detekt's reports are already small (one file per format), so this one only needed the
      # quota-tolerance and the shorter retention.
      - name: Upload detekt report
        if: failure() && steps.changes.outputs.backend == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: backend/build/reports/detekt/
          retention-days: 1

      # Both reporting steps below MUST stay gated. With no tests run there is no JUnit XML and no
      # JaCoCo XML on disk, and both actions fail on a missing report — which would turn the cheap
      # path red and defeat the whole point of making this check requirable.
      - name: Publish test report
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.backend == 'true'
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'backend/build/test-results/test/*.xml'
          check_name: 'Backend Test Results'

      - name: Add coverage to PR comment
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.backend == 'true'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: backend/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 30
          min-coverage-changed-files: 60
          title: 'Backend Code Coverage'

  # --- Docker Build ---
  docker:
    name: Docker Build
    runs-on: [self-hosted, linux, x64]
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: muhabbet-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
