name: Deploy to Hetzner VPS

# Deploy is GATED on a successful "Backend CI" run for the same commit on main.
# Using workflow_run (instead of a bare push trigger) is the cross-workflow equivalent of
# `needs: [build-and-test]`: a failing test suite produces a non-"success" conclusion and the
# deploy job is skipped, so broken code can no longer reach production (P0-18).
on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

# Queue, never cancel. `cancel-in-progress: true` cost a whole release on 2026-08-17 and left no
# failure behind to notice:
#
#   14:19  workflow_dispatch  starts deploying 0.3.6
#   14:20  Backend CI on main finishes (it had failed, on #563's 429) and fires `workflow_run`
#          -> that run enters this group and CANCELS the deploy that is halfway through
#   14:20  the new run's `if:` sees conclusion != 'success' -> SKIPPED
#
# Net: nothing deployed, and neither run reported a failure — one "cancelled", one "skipped".
# Production sat on the previous build while `/actuator/health` answered 200, which is exactly the
# trap CLAUDE.md warns about: a healthy container is not evidence that your code is on it.
#
# GitHub evaluates concurrency BEFORE the job-level `if:`, so a run that is about to be skipped can
# still cancel a running one. That makes `cancel-in-progress` unusable here regardless of the gate.
# Queuing is also simply the right behaviour for a deploy: killing one mid-flight can leave a
# half-built image or a stopped container, which cancelling a test run never does.
concurrency:
  group: deploy-muhabbet
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Muhabbet
    runs-on: [self-hosted, linux, x64]
    environment: production
    # Only deploy when the upstream CI run succeeded (or on a manual dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        # The health window below can now take 240s on its own, on top of a Gradle build. The old
        # 8m/6m pair left no room for it: the ssh action would be killed mid-loop and the run would
        # fail with "Run Command Timeout" rather than a health verdict.
        timeout-minutes: 15
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -e
            cd /opt/projects/Muhabbet
            git pull origin main

            # Capture the currently-running backend image's immutable ID + the compose repo:tag it
            # is referenced by, so we can roll back even after `build` reassigns :latest.
            PREV_IMAGE_ID="$(docker inspect --format '{{.Image}}' muhabbet-backend 2>/dev/null || true)"
            PREV_IMAGE_REF="$(docker inspect --format '{{.Config.Image}}' muhabbet-backend 2>/dev/null || true)"
            echo "Previous backend image: ref=${PREV_IMAGE_REF:-<none>} id=${PREV_IMAGE_ID:-<none>}"

            cd /opt/projects
            ./infra/deploy.sh build muhabbet
            ./infra/deploy.sh restart muhabbet

            # Health check with retries. The old window was 5 x 15s = 75s, and every deploy failed
            # it while the service came up healthy moments later — so the pipeline reported failure
            # on success and triggered the rollback below on a good deployment. 75s does not cover
            # a Spring Boot 4 boot plus Flyway plus Traefik noticing the new container.
            #
            # The container's own health state is checked first because it is local and immediate;
            # the public URL additionally depends on Traefik picking up the route, so a pass there
            # is the stronger signal but a slower one.
            HEALTHY=0
            for i in $(seq 1 24); do
              sleep 10
              if curl -sf https://muhabbet-api.rollingcatsoftware.com/actuator/health > /dev/null 2>&1; then
                echo "API healthy after ${i}0s"
                HEALTHY=1
                break
              fi
              STATE="$(docker inspect --format '{{.State.Health.Status}}' muhabbet-backend 2>/dev/null || echo unknown)"
              echo "Attempt $i: API not ready yet (container health: $STATE)"
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "Health check FAILED after 240s. Container state and last 50 log lines:"
              docker ps --filter name=muhabbet-backend --format '{{.Names}} {{.Status}}' || true
              docker logs --tail 50 muhabbet-backend 2>&1 || true

              echo "Attempting rollback to previous backend image."
              if [ -n "$PREV_IMAGE_ID" ] && [ -n "$PREV_IMAGE_REF" ]; then
                # Re-point the compose repo:tag at the known-good image ID, then restart without rebuilding.
                #
                # This used to run against /opt/projects/Muhabbet/infra, which is the LEGACY nginx
                # stack: a different compose file with its own postgres/redis/minio, no Traefik
                # labels, no .env.prod and no service called "backend". It could not have worked,
                # and its failing is the only reason a healthy deployment survived the bad health
                # check above. The stack that actually runs is the repo-root compose file, with
                # .env.prod alongside it and the service named muhabbet-backend.
                # `|| true` on the tag as well as the restart. `set -e` is active, so a failing
                # `docker tag` — a pruned image ID, a digest-pinned ref — would abort the script
                # here, before the "Deploy failed health check" line and before the loop below
                # says whether production came back. The run would still be red, but it would be
                # red with no statement of whether the rollback worked, which is the one thing
                # the operator needs at 3am.
                docker tag "$PREV_IMAGE_ID" "$PREV_IMAGE_REF" || true
                cd /opt/projects/Muhabbet
                docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-build muhabbet-backend || true
                ROLLED_BACK=0
                for i in 1 2 3 4 5 6; do
                  sleep 10
                  if curl -sf https://muhabbet-api.rollingcatsoftware.com/actuator/health > /dev/null 2>&1; then
                    echo "Rollback to previous image is healthy. Production is on the PREVIOUS build."
                    ROLLED_BACK=1
                    break
                  fi
                done
                # The old loop simply ended when it ran out of attempts, so a rollback that never
                # recovered read exactly like one that did: no line either way. A silent safety net
                # is the same failure mode as the wrong-stack rollback this issue is about.
                if [ "$ROLLED_BACK" != "1" ]; then
                  echo "ROLLBACK ALSO FAILED after 60s — production is DOWN. Manual intervention required now."
                  docker ps --filter name=muhabbet-backend --format '{{.Names}} {{.Status}}' || true
                  docker logs --tail 50 muhabbet-backend 2>&1 || true
                fi
              else
                echo "No previous image captured — cannot auto-roll back. Manual intervention required."
              fi
              echo "Deploy failed health check."
              exit 1
            fi

            echo "Muhabbet deployed successfully"
