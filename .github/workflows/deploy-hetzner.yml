name: Deploy to Hetzner VPS

# MANUAL ONLY (F15). Production no longer runs on the Hetzner host this workflow was written for, and
# the VPS_* secrets were never updated for the move. Until a deploy path for the current production
# host exists and has been tried by hand, nothing may start this workflow automatically.
#
# It used to be triggered by `workflow_run` of "Backend CI" on `main`. Two things were wrong with that:
#   1. Every green Backend CI on `main` would SSH to the old host and rebuild there, against a stale
#      .env.prod, while the public health URL (which now resolves to the new host) answered 200 — so
#      the run reported "deployed successfully" and production was unchanged.
#   2. The `branches: [main]` filter matches the HEAD branch name of the upstream run, and the job only
#      checked `conclusion == 'success'`. A pull request from a fork whose branch is called `main`
#      could therefore start a run holding the deploy secrets (F33/F57).
# Removing the trigger removes both. If `workflow_run` is ever reintroduced, the job MUST also check
# `github.event.workflow_run.event == 'push'` and
# `github.event.workflow_run.head_repository.full_name == github.repository`.
#
# The person dispatching it states which machine they mean (`expected_hostname`), and the script
# refuses to touch anything unless the SSH target reports exactly that hostname and already runs the
# Muhabbet stack. Health is judged on that machine, from the container itself — never through public
# DNS, which can point at a different machine than the one just deployed to.
on:
  workflow_dispatch:
    inputs:
      expected_hostname:
        description: 'Hostname (output of `hostname`) of the machine VPS_HOST must reach. The deploy refuses to run anywhere else.'
        required: true
        type: string

# Queue, never cancel. Killing a deploy mid-flight can leave a half-built image or a stopped container.
concurrency:
  group: deploy-muhabbet
  cancel-in-progress: false

# Nothing here uses the GITHUB_TOKEN: the job checks nothing out and calls no API.
permissions: {}

jobs:
  deploy:
    name: Deploy Muhabbet
    runs-on: [self-hosted, linux, x64]
    environment: production
    # Only from main. A dispatch on any other ref is skipped.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - name: Validate the requested host name
        env:
          EXPECTED_HOSTNAME: ${{ inputs.expected_hostname }}
        run: |
          if ! printf '%s' "$EXPECTED_HOSTNAME" | grep -qE '^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$'; then
            echo "::error::expected_hostname must be a plain host name."
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        # The health window below can take 240s on its own, on top of a Gradle build.
        timeout-minutes: 15
        env:
          EXPECTED_HOSTNAME: ${{ inputs.expected_hostname }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: EXPECTED_HOSTNAME
          command_timeout: 12m
          script: |
            set -eu

            # ── Is this the machine we were asked to deploy to? ─────────────────────────────────
            ACTUAL_HOSTNAME="$(hostname)"
            if [ "$ACTUAL_HOSTNAME" != "$EXPECTED_HOSTNAME" ]; then
              echo "REFUSING: the SSH target is '$ACTUAL_HOSTNAME', not '$EXPECTED_HOSTNAME'. VPS_HOST points at the wrong machine. Nothing was changed."
              exit 1
            fi
            if [ ! -f /opt/projects/Muhabbet/docker-compose.prod.yml ] || [ ! -x /opt/projects/infra/deploy.sh ]; then
              echo "REFUSING: $ACTUAL_HOSTNAME has no /opt/projects/Muhabbet/docker-compose.prod.yml or /opt/projects/infra/deploy.sh. Nothing was changed."
              exit 1
            fi
            if ! docker inspect muhabbet-backend >/dev/null 2>&1; then
              echo "REFUSING: no muhabbet-backend container on $ACTUAL_HOSTNAME, so it is not running production. Nothing was changed."
              exit 1
            fi

            cd /opt/projects/Muhabbet
            git pull origin main

            # Capture the running image's immutable ID and the repo:tag it is referenced by, so we can
            # roll back even after `build` reassigns :latest. IDs and image names only — no config.
            PREV_IMAGE_ID="$(docker inspect --format '{{.Image}}' muhabbet-backend 2>/dev/null || true)"
            PREV_IMAGE_REF="$(docker inspect --format '{{.Config.Image}}' muhabbet-backend 2>/dev/null || true)"
            echo "Previous backend image: ref=${PREV_IMAGE_REF:-<none>} id=${PREV_IMAGE_ID:-<none>}"

            cd /opt/projects
            ./infra/deploy.sh build muhabbet
            ./infra/deploy.sh restart muhabbet

            # ── Health, judged on this machine ──────────────────────────────────────────────────
            # Two conditions, both required:
            #   - the container that is running uses the image that was just built (a healthy OLD
            #     container is not a successful deploy), and
            #   - Docker reports that container healthy (compose healthcheck: /actuator/health inside
            #     the container).
            # The public URL is deliberately not consulted: it is served by whichever machine DNS
            # points at, which is exactly how this workflow once reported success for a deploy that
            # never reached production. Anything that cannot be determined counts as unhealthy.
            NEW_IMAGE_REF="$(docker inspect --format '{{.Config.Image}}' muhabbet-backend 2>/dev/null || true)"
            EXPECTED_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${NEW_IMAGE_REF:-none}" 2>/dev/null || true)"
            HEALTHY=0
            for i in $(seq 1 24); do
              sleep 10
              RUNNING_IMAGE_ID="$(docker inspect --format '{{.Image}}' muhabbet-backend 2>/dev/null || echo none)"
              STATE="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' muhabbet-backend 2>/dev/null || echo unknown)"
              if [ -n "$EXPECTED_IMAGE_ID" ] && [ "$RUNNING_IMAGE_ID" = "$EXPECTED_IMAGE_ID" ] && [ "$STATE" = "healthy" ]; then
                echo "muhabbet-backend healthy on $ACTUAL_HOSTNAME after ${i}0s, running the new image."
                HEALTHY=1
                break
              fi
              echo "Attempt $i: container health=$STATE, running the new image: $([ "$RUNNING_IMAGE_ID" = "$EXPECTED_IMAGE_ID" ] && echo yes || echo no)"
            done

            if [ "$HEALTHY" != "1" ]; then
              # Container status only. The container log is NOT printed: this repository's Actions
              # logs are public, and the backend log can hold one-time codes and request details.
              # Read it on the host with `docker logs --tail 50 muhabbet-backend`.
              echo "Health check FAILED after 240s on $ACTUAL_HOSTNAME."
              docker ps --filter name=muhabbet-backend --format '{{.Names}} {{.Status}}' || true

              echo "Attempting rollback to previous backend image."
              if [ -n "$PREV_IMAGE_ID" ] && [ -n "$PREV_IMAGE_REF" ]; then
                # The stack that runs is the repo-root compose file, with .env.prod alongside it and
                # the service named muhabbet-backend. `|| true` so a failing step still reaches the
                # verdict below rather than aborting under `set -e` with no statement either way.
                docker tag "$PREV_IMAGE_ID" "$PREV_IMAGE_REF" || true
                cd /opt/projects/Muhabbet
                docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-build muhabbet-backend || true
                ROLLED_BACK=0
                for i in 1 2 3 4 5 6; do
                  sleep 10
                  RUNNING_IMAGE_ID="$(docker inspect --format '{{.Image}}' muhabbet-backend 2>/dev/null || echo none)"
                  STATE="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' muhabbet-backend 2>/dev/null || echo unknown)"
                  if [ "$RUNNING_IMAGE_ID" = "$PREV_IMAGE_ID" ] && [ "$STATE" = "healthy" ]; then
                    echo "Rollback to previous image is healthy. Production is on the PREVIOUS build."
                    ROLLED_BACK=1
                    break
                  fi
                done
                if [ "$ROLLED_BACK" != "1" ]; then
                  echo "ROLLBACK ALSO FAILED after 60s — production is DOWN. Manual intervention required now."
                  docker ps --filter name=muhabbet-backend --format '{{.Names}} {{.Status}}' || true
                fi
              else
                echo "No previous image captured — cannot auto-roll back. Manual intervention required."
              fi
              echo "Deploy failed health check."
              exit 1
            fi

            echo "Muhabbet deployed successfully to $ACTUAL_HOSTNAME"
