name: Mobile Release

# Builds and SIGNS the release APK + AAB for a tag, and attaches them to that tag's GitHub release.
#
# Why this exists: 0.3.0 was built on the server, which does not hold the release keystore, so the
# only artifact it could produce was unsigned. An unsigned APK fails to install with "package
# appears to be invalid", and signing it with any other key makes Android refuse it as an upgrade.
# Every release therefore required a manual signing step on the owner's machine. This workflow moves
# that step into CI so a tag produces an installable APK on its own.
#
# REQUIRED SECRETS — the workflow fails fast and explains itself if any is missing:
#   MUHABBET_KEYSTORE_BASE64    base64 of the release .jks   (base64 -w0 muhabbet-release.jks)
#   MUHABBET_KEYSTORE_PASSWORD  the keystore password
#   MUHABBET_KEY_ALIAS          the key alias inside the keystore
#   MUHABBET_KEY_PASSWORD       the key password
#
# NOTE ON TRUST: these jobs run on the SELF-HOSTED runner, which is the same server that hosts the
# production backend. The signing key is decoded to disk there for the duration of the build and
# shredded afterwards. That is a deliberate trade the owner accepted; anyone who can run arbitrary
# workflow code on that runner can read the key while a release build is in flight.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and sign, e.g. v0.3.1'
        required: true
      play_track:
        description: 'Play track to publish the AAB to. "none" builds and signs without publishing.'
        required: false
        default: 'none'
        type: choice
        options: ['none', 'internal', 'alpha', 'beta', 'production']

concurrency:
  group: mobile-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  ANDROID_HOME: ${{ vars.ANDROID_HOME || '/opt/android-sdk' }}
  ANDROID_SDK_ROOT: ${{ vars.ANDROID_HOME || '/opt/android-sdk' }}

  # The certificate every Muhabbet release since 0.2.0 has been signed with. This is a public
  # fingerprint, not a secret. It is asserted after signing because the failure it guards against is
  # silent and unrecoverable-in-place: an APK signed with the wrong key installs fine on a clean
  # phone and is refused as an upgrade by every existing user, which is only discovered after
  # publishing. Read from the 0.2.2 asset with `apksigner verify --print-certs`.
  EXPECTED_SIGNER_SHA256: 'e848191121876e08cc0968ae2a3c8591810add502e52e5d5dd1c8bb1f2aa3560'

jobs:
  release:
    name: Build signed release
    runs-on: [self-hosted, linux, x64]

    steps:
      # The dispatch input reaches the shell only through env, never interpolated into a run line,
      # and is shape-checked before it is used as a git ref.
      - name: Resolve and validate the tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Refusing to build '$TAG' — expected a tag like v0.3.1."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Fail early if the signing secrets are absent
        env:
          KS_B64: ${{ secrets.MUHABBET_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MUHABBET_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUHABBET_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MUHABBET_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS_B64" ]    && missing="$missing MUHABBET_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ]   && missing="$missing MUHABBET_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing MUHABBET_KEY_ALIAS"
          [ -z "$KEY_PASS" ]  && missing="$missing MUHABBET_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "The keystore goes in base64: base64 -w0 muhabbet-release.jks"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # google-services.json is gitignored, so the checkout does not have it and the Android build
      # cannot configure without it. Same secret the CI workflow uses.
      - name: Inject google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set. A release build must not ship a dummy Firebase config."
            exit 1
          fi
          mkdir -p mobile/composeApp
          printf '%s' "$GS_JSON" | base64 --decode > mobile/composeApp/google-services.json

      - name: Decode the release keystore
        env:
          KS_B64: ${{ secrets.MUHABBET_KEYSTORE_BASE64 }}
        run: |
          umask 077
          KS_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$KS_DIR"
          printf '%s' "$KS_B64" | base64 --decode > "$KS_DIR/release.jks"
          if [ ! -s "$KS_DIR/release.jks" ]; then
            echo "::error::Decoded keystore is empty — MUHABBET_KEYSTORE_BASE64 is probably not valid base64."
            exit 1
          fi
          echo "MUHABBET_KEYSTORE_FILE=$KS_DIR/release.jks" >> "$GITHUB_ENV"

      # signingConfigs.release in mobile/composeApp/build.gradle.kts activates only when
      # MUHABBET_KEYSTORE_FILE is present in the environment, so these four drive it directly.
      - name: Build signed APK and AAB
        env:
          MUHABBET_KEYSTORE_PASSWORD: ${{ secrets.MUHABBET_KEYSTORE_PASSWORD }}
          MUHABBET_KEY_ALIAS: ${{ secrets.MUHABBET_KEY_ALIAS }}
          MUHABBET_KEY_PASSWORD: ${{ secrets.MUHABBET_KEY_PASSWORD }}
        run: |
          ./gradlew :mobile:composeApp:verifyBuildInfoVersion
          ./gradlew :mobile:composeApp:assembleRelease :mobile:composeApp:bundleRelease

      - name: Verify the signature is the real release key
        id: verify
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          [ -z "$APKSIGNER" ] && { echo "::error::apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }

          APK=$(find mobile/composeApp/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No signed APK was produced — the release buildType did not pick up the signing config."
            find mobile/composeApp/build/outputs/apk/release -name '*.apk' || true
            exit 1
          fi

          "$APKSIGNER" verify --print-certs -v "$APK" > signer.txt 2>&1 || {
            echo "::error::apksigner could not verify the APK"; cat signer.txt; exit 1; }
          cat signer.txt

          ACTUAL=$(grep -m1 'certificate SHA-256 digest' signer.txt | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::Signed with the WRONG KEY. Expected $EXPECTED_SIGNER_SHA256, got $ACTUAL."
            echo "Publishing this would break upgrades for every existing user. Refusing."
            exit 1
          fi
          grep -q 'v2 scheme (APK Signature Scheme v2): true' signer.txt || {
            echo "::error::APK is not v2-signed; Android 11+ will reject it."; exit 1; }

          VERSION="${TAG#v}"
          cp "$APK" "muhabbet-$VERSION.apk"
          AAB=$(find mobile/composeApp/build/outputs/bundle/release -name '*.aab' | head -1)
          [ -n "$AAB" ] && cp "$AAB" "muhabbet-$VERSION.aab"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          # --clobber so re-running a release replaces its artifacts instead of erroring. The release
          # is left in whatever draft state it already had; publishing stays a human decision.
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "Muhabbet $VERSION" \
              --notes "Signed build produced by Mobile Release for $TAG."
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "muhabbet-$VERSION.apk" $([ -f "muhabbet-$VERSION.aab" ] && echo "muhabbet-$VERSION.aab")
          echo "Attached signed artifacts to $TAG."

      # ── Publish to Google Play ────────────────────────────────────────────────────────────────
      #
      # Only runs when a track is explicitly chosen, so a tag push still just builds and signs. The
      # Play API is called directly with curl rather than through a third-party action: this is the
      # self-hosted runner that also holds the release keystore, and the fewer things that see the
      # service-account key there, the better. `google-github-actions/auth` is Google's own action
      # and only mints a scoped access token.
      #
      # Publishing is a four-call transaction: open an edit, upload the bundle, point a track at the
      # resulting versionCode, commit. Nothing is visible on Play until the commit succeeds, so a
      # failure part-way through leaves the listing untouched rather than half-updated.
      - name: Check the Play track request
        id: play
        env:
          TRACK: ${{ github.event.inputs.play_track || 'none' }}
          HAVE_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          if [ "$TRACK" = "none" ] || [ -z "$TRACK" ]; then
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "No Play track requested — build and sign only."
            exit 0
          fi
          if [ "$HAVE_KEY" != "true" ]; then
            echo "::error::play_track=$TRACK was requested but the PLAY_SERVICE_ACCOUNT_JSON secret is not set."
            echo "Create a service account in Google Cloud, grant it access in Play Console under"
            echo "Users and permissions, and add its JSON key as that secret. See issue #485."
            exit 1
          fi
          echo "requested=true" >> "$GITHUB_OUTPUT"
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"

      # Mints the access token from the service-account key directly, with the standard
      # OAuth2 JWT-bearer flow that Google documents for server-to-server access.
      #
      # This replaces `google-github-actions/auth`, which failed the first real run:
      # asking it for an access token makes it call `iamcredentials.googleapis.com`
      # (generateAccessToken), and that API is disabled on the project —
      # "IAM Service Account Credentials API has not been used in project 365129894393
      # before or it is disabled". The JWT-bearer flow needs no such API: the key signs
      # its own assertion and exchanges it at oauth2.googleapis.com/token. So this is
      # one fewer Google API to keep enabled, and one fewer third-party action holding
      # a publishing credential on a runner that is also the production host.
      #
      # openssl and python3 only — both already on the runner, nothing installed.
      - name: Mint a Play access token
        if: steps.play.outputs.requested == 'true'
        id: gauth
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          KEYDIR="$RUNNER_TEMP/play"
          mkdir -p "$KEYDIR"
          printf '%s' "$SA_JSON" > "$KEYDIR/sa.json"

          CLIENT_EMAIL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["client_email"])' "$KEYDIR/sa.json")
          python3 -c 'import json,sys; open(sys.argv[2],"w").write(json.load(open(sys.argv[1]))["private_key"])' "$KEYDIR/sa.json" "$KEYDIR/key.pem"

          b64url() { base64 -w0 | tr '+/' '-_' | tr -d '='; }

          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          CLAIMS=$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/androidpublisher","aud":"https://oauth2.googleapis.com/token","exp":%s,"iat":%s}' \
                     "$CLIENT_EMAIL" "$((NOW + 3600))" "$NOW" | b64url)
          SIG=$(printf '%s.%s' "$HEADER" "$CLAIMS" | openssl dgst -sha256 -sign "$KEYDIR/key.pem" -binary | b64url)

          RESP=$(curl -sS -X POST https://oauth2.googleapis.com/token \
                   --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
                   --data-urlencode "assertion=${HEADER}.${CLAIMS}.${SIG}")

          TOKEN=$(printf '%s' "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "$TOKEN" ]; then
            # The response carries the reason (invalid_grant, unauthorized_client, …) and no
            # secret, so printing it is what makes the next failure diagnosable in one look.
            echo "::error::Could not mint a Play access token."
            printf '%s\n' "$RESP"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"
          rm -f "$KEYDIR/key.pem" "$KEYDIR/sa.json"
          echo "Access token minted for $CLIENT_EMAIL"

      - name: Upload the bundle and roll the track
        if: steps.play.outputs.requested == 'true'
        env:
          TOKEN: ${{ steps.gauth.outputs.access_token }}
          TRACK: ${{ steps.play.outputs.track }}
          VERSION: ${{ steps.verify.outputs.version }}
          PKG: com.muhabbet.app
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API=https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PKG
          UPLOAD=https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PKG

          AAB="muhabbet-$VERSION.aab"
          [ -f "$AAB" ] || { echo "::error::$AAB was not produced; nothing to publish."; exit 1; }

          # Every call is checked. A silent failure here is the worst outcome: the run goes green and
          # the release simply is not on Play, which is indistinguishable from a slow review.
          api() {
            local method=$1 url=$2 out
            shift 2
            out=$(curl -sS -w '\n%{http_code}' -X "$method" -H "Authorization: Bearer $TOKEN" "$@" "$url")
            local code=${out##*$'\n'} body=${out%$'\n'*}
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::Play API $method $url returned $code"
              echo "$body"
              return 1
            fi
            printf '%s' "$body"
          }

          EDIT=$(api POST "$API/edits" -H 'Content-Length: 0' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "Opened edit $EDIT"

          CODE=$(api POST "$UPLOAD/edits/$EDIT/bundles?uploadType=media" \
                   -H 'Content-Type: application/octet-stream' --data-binary "@$AAB" \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])')
          echo "Uploaded $AAB as versionCode $CODE"

          # Release notes come from the GitHub release body, trimmed to Play's 500-character limit.
          # Turkish is the default listing language, so tr-TR is what the note is filed under.
          NOTES=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | head -c 500 || true)
          [ -n "$NOTES" ] || NOTES="Muhabbet $VERSION"

          TRACK_BODY=$(VERSION="$VERSION" CODE="$CODE" TRACK="$TRACK" NOTES="$NOTES" python3 - <<'PY'
          import json, os
          print(json.dumps({
              "track": os.environ["TRACK"],
              "releases": [{
                  "name": os.environ["VERSION"],
                  "versionCodes": [os.environ["CODE"]],
                  "status": "completed",
                  "releaseNotes": [{"language": "tr-TR", "text": os.environ["NOTES"]}],
              }],
          }))
          PY
          )

          api PUT "$API/edits/$EDIT/tracks/$TRACK" \
            -H 'Content-Type: application/json' --data "$TRACK_BODY" > /dev/null
          echo "Pointed the $TRACK track at versionCode $CODE"

          api POST "$API/edits/$EDIT:commit" -H 'Content-Length: 0' > /dev/null
          echo "Committed. Muhabbet $VERSION is on the $TRACK track."

      # Runs even when the build fails, so a failed run never leaves the signing key on the runner.
      - name: Shred the keystore
        if: always()
        run: |
          if [ -n "${MUHABBET_KEYSTORE_FILE:-}" ] && [ -f "$MUHABBET_KEYSTORE_FILE" ]; then
            shred -u "$MUHABBET_KEYSTORE_FILE" 2>/dev/null || rm -f "$MUHABBET_KEYSTORE_FILE"
          fi
          rm -rf "$RUNNER_TEMP/signing" mobile/composeApp/google-services.json
