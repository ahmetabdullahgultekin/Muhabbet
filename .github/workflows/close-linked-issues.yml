# Closes the issues a pull request says it closes, when that pull request merges into `dev`.
#
# GitHub does this natively — but only for the repository's **default** branch, which here is
# `main`. Every piece of work in this repo is merged into `dev`, so `Closes #349` in a PR body has
# never once closed an issue. Nor does it close later: the release PR that carries `dev` into `main`
# has its own body, and the individual `Closes` lines are not in it.
#
# That is the whole mechanical explanation for a pattern that had been read as carelessness. On
# 2026-08-21 a triage pass found a dozen issues describing defects that were fixed weeks earlier —
# #349, #594, #618, #622, #633, #638, #641, #642 among them — still open, still being handed to
# agents as work, still counted in the milestone. One of them was assigned to an agent that day and
# came back with "this is already fixed; the issue is open for process reasons."
#
# Two ways to fix it. Making `dev` the default branch gets the behaviour for free, and was rejected:
# `main` is what a visitor to a public repository should land on, and it is what releases are cut
# from. So the automation is reproduced here instead, deliberately narrow — it closes only what a PR
# explicitly claims, in the same keywords GitHub itself honours.
name: Close linked issues on dev merge

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    # Closing on merge, not on "closed": a PR abandoned without merging has fixed nothing.
    if: github.event.pull_request.merged == true
    # Self-hosted, not `ubuntu-latest`. Every GitHub-hosted job on this account is refused before it
    # starts, with "The job was not started because your account is locked due to a billing issue".
    # That refusal produces a red X and no log, so this workflow ran three times, closed nothing, and
    # looked wired up the whole time — the exact failure mode it was written to end.
    #
    # The self-hosted runner takes ONE job at a time on the production host, so this does join the
    # deploy queue. It is a few seconds of API calls; a few seconds in the queue beats a job that
    # cannot start. `gh` 2.89 is already installed there and nothing is checked out.
    runs-on: [self-hosted, linux, x64]
    steps:
      # Runs before anything is closed, and fails the job if the extractor has drifted. A regex that
      # decides which issues get closed is worth a test: the previous one was wrong for two months
      # and nothing said so, because "closed fewer issues than it should have" looks exactly like
      # "the PR did not claim any". Cheap — no checkout, no network, pure shell.
      - name: The extractor still extracts
        run: |
          set -euo pipefail

          # `|| true` because "no match" is a legitimate answer, and grep reports it as failure —
          # under `set -e -o pipefail` an unmatched body would kill the job instead of returning
          # the empty string the two "nothing to close" cases below are asserting.
          extract() {
            printf '%s' "$1" \
              | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+([[:space:]]*(,|and|&)[[:space:]]*#[0-9]+)*' \
              | grep -oE '#[0-9]+' | tr -d '#' | sort -un | tr '\n' ' ' | sed 's/ $//' || true
          }

          fail=0
          check() {
            got=$(extract "$2")
            if [ "$got" = "$3" ]; then
              echo "ok   $1"
            else
              echo "FAIL $1: expected '$3', got '$got'" >&2
              fail=1
            fi
          }

          # Real PR bodies from this repository, and the traps around them.
          check "comma list (PR #410)"      'Closes #397, #401, #402.'              '397 401 402'
          check "and-list (PR #652)"        'Fixes #595 and #623 but see #999.'     '595 623'
          check "and not followed by an id" 'Closes #1 and then #2 is unrelated'    '1'
          check "no keyword"                'See #10, related to #11'               ''
          check "ampersand list"            'Resolves #7 & #8 & #9'                 '7 8 9'
          check "keyword per line"          'fixed #3
          Closes #4'                                                                '3 4'
          check "bare reference"            'This mentions #50 with no keyword'     ''

          [ "$fail" -eq 0 ] || { echo "The closing-keyword extractor is wrong. Fix it before this job closes anything." >&2; exit 1; }

      - name: Close what the PR says it closes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # The keywords GitHub itself honours, and only those. "Fixes #123" closes; "See #123",
          # "Related to #123" and a bare "#123" do not — a PR mentions far more issues than it ends,
          # and closing a merely-referenced one is worse than leaving it open.
          #
          # The trailing group walks a LIST after one keyword: `Closes #397, #401, #402` and
          # `Fixes #595 and #623` end all of them, not just the first. Without it this workflow
          # reproduced GitHub's own limitation, which is how #401, #402 and #623 sat open for weeks
          # behind merged PRs that said they closed them — the automation written to stop exactly
          # that had the same blind spot as the thing it replaced.
          #
          # The list stops at the first token that is not a separator followed by another `#N`, so
          # `Fixes #595 and #623 but see #999` takes 595 and 623 and leaves 999, and
          # `Closes #1 and then #2 is unrelated` takes only 1 — `and` must be followed by `#N` for
          # the chain to continue. Seven cases including those two are pinned in the step below.
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+([[:space:]]*(,|and|&)[[:space:]]*#[0-9]+)*' \
            | grep -oE '#[0-9]+' \
            | tr -d '#' \
            | sort -un > /tmp/linked.txt || true

          if [ ! -s /tmp/linked.txt ]; then
            echo "PR #$PR_NUMBER claims to close nothing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "## Linked issues" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          while read -r n; do
            state=$(gh issue view "$n" --repo "$REPO" --json state --jq .state 2>/dev/null || echo MISSING)
            case "$state" in
              OPEN)
                # The comment matters as much as the close. An issue that shuts with no explanation
                # is indistinguishable from one someone gave up on, and this repo has a standing
                # rule that a mobile fix is not done until it has been driven on a device — so the
                # comment says plainly that merging is not that.
                cat > /tmp/comment.md <<COMMENT
          Kapatan: #$PR_NUMBER (\`dev\`'e merge edildi).

          Bu kapatmayi otomasyon yapti: GitHub bagli issue'lari yalnizca varsayilan dala
          (\`main\`) merge edildiginde kapatiyor, bu depodaki her is ise \`dev\`'e giriyor.

          **Merge edilmis olmak, cihazda gorulmus olmak degildir.** Kullaniciya gorunen bir
          degisiklikse, emulatorde veya gercek telefonda surulene kadar dogrulanmis sayilmaz —
          oyleyse bu issue'yu yeniden acin.
          COMMENT
                sed -i 's/^          //' /tmp/comment.md
                gh issue comment "$n" --repo "$REPO" --body-file /tmp/comment.md
                gh issue close "$n" --repo "$REPO" --reason completed
                echo "- Closed #$n" >> "$GITHUB_STEP_SUMMARY"
                ;;
              CLOSED)  echo "- #$n was already closed" >> "$GITHUB_STEP_SUMMARY" ;;
              *)       echo "- #$n could not be read (deleted, or a pull request)" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          done < /tmp/linked.txt
