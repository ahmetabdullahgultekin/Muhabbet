name: Secret Scan

# Its own workflow, with no `paths:` filter and no branch filter, on purpose (F25).
#
# It used to be a job inside security.yml, which fires only for pushes and pull requests on
# `main`/`develop` and only when backend or build files change. `develop` does not exist here and
# `dev` was not listed, so integration-branch pushes were never scanned, and a commit touching only
# docs/, compose files, .env* or mobile/ was never scanned on push or PR either. That is where the
# leaks this repository has had actually landed.
#
#   push           every branch and tag: scans the pushed commits
#   pull_request   every base branch: scans the pull request's commits
#   schedule       weekly: scans the FULL history (gitleaks-action does that for schedule and
#                  workflow_dispatch), so a rule added later still sees old commits
#
# A finding fails the job. The configuration is .gitleaks.toml at the repository root.

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  schedule:
    # Mondays 06:30 UTC, after security.yml's 06:00 run.
    - cron: '30 6 * * 1'
  workflow_dispatch:

# Never cancel a running scan: a push scan covers only that push's commits, so cancelling it for a
# newer push would leave the earlier commits unscanned until the weekly full-history run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits through the API.
  pull-requests: read

jobs:
  gitleaks:
    name: Secret Detection
    runs-on: [self-hosted, linux, x64]
    # Backstop for CICD-01, not the fix: a fork PR runs workflow files from its own head and can delete
    # this line. The fix is the repo setting 'Require approval for all outside collaborators' and, structurally,
    # no PR job on a persistent runner (ADR 0031). See docs/process/ci-trust-boundary.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The version .gitleaks.toml was validated against. Without it the action picks one itself.
          GITLEAKS_VERSION: '8.24.3'
          # No pull request comment: the repository is public, and a comment quoting the finding is
          # one more place a leaked value is written. The job log is redacted by the action.
          GITLEAKS_ENABLE_COMMENTS: false
          # The action's SARIF upload derives its root directory from $HOME (/home/deploy) while the
          # workspace is under the runner's _work directory, and fails with "The rootDirectory ... is
          # not a parent directory of the file". The findings are in the step's own output.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
