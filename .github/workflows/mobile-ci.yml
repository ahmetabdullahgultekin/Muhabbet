name: Mobile CI

on:
  workflow_dispatch:
    inputs:
      record_goldens:
        description: 'Re-record the design-system screenshot goldens and upload them as an artifact (#759)'
        type: boolean
        default: false
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    # `dev` added: it is the working branch, and until this landed NO CI ran on any pull
    # request into it (#487) — `develop` does not exist here, so the filter matched nothing.
    # The android-build job is gated to skip the expensive APK assembly on a dev PR and run
    # only the compile and unit-test gates; see its `if:` conditions. The full APK still
    # builds on `main`, and `Mobile Release` builds and signs it for a tag regardless.
    #
    # There is deliberately NO `paths:` filter here any more. A filter on the trigger does not make
    # an irrelevant pull request cheap — it stops the workflow from STARTING, so GitHub never creates
    # the "Android Build" check run at all. #682 and #683 changed only documentation and carried zero
    # checks. A check that is sometimes not created can never be a *required* check: GitHub holds
    # such a pull request at "Expected — waiting for status to be reported" forever. And without a
    # required check, a red pull request merges — which is how `dev` was broken on 2026-08-21.
    #
    # The filtering moved INTO the job: see the "Decide what this pull request needs" step below.
    # The old path list is preserved there verbatim, including `.github/workflows/mobile-ci.yml`,
    # which was added to the filter on purpose so a change to this workflow is exercised by the pull
    # request that makes it.
    branches: [main, dev, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

  # Without this the Android job has NEVER built — every run since the workflow was written died at
  # "SDK location not found ... ANDROID_HOME". The SDK is on the self-hosted runner at
  # /opt/android-sdk (platforms 34/35/36, build-tools 34/35/36, owned by the runner user), but
  # nothing pointed at it: local.properties carries sdk.dir for developers and is gitignored, so the
  # checkout has neither the file nor the variable.
  #
  # Hardcoding a host path is acceptable precisely because these jobs are pinned to `self-hosted`.
  # Override with a repository variable if the SDK ever moves, rather than editing this file.
  ANDROID_HOME: ${{ vars.ANDROID_HOME || '/opt/android-sdk' }}
  ANDROID_SDK_ROOT: ${{ vars.ANDROID_HOME || '/opt/android-sdk' }}

jobs:
  # --- Android Build ---
  android-build:
    name: Android Build
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v4

      # The `paths:` filter that used to sit on the trigger lives here now, with the same list of
      # paths. Every step below that costs more than a few seconds is gated on this output, so the
      # check run is always created (and can therefore be required on a branch) while a pull request
      # that touches no mobile source still finishes in seconds. See
      # .github/scripts/paths-changed.sh for the full reasoning.
      - name: Decide what this pull request needs
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mobile=$(bash .github/scripts/paths-changed.sh \
            mobile/ \
            shared/ \
            build.gradle.kts \
            settings.gradle.kts \
            gradle.properties \
            gradle/ \
            .github/workflows/mobile-ci.yml)
          case "$mobile" in
            true|false) ;;
            *)
              # A silent "false" would turn every pull request green without compiling anything,
              # which is worse than any build failure. Refuse to continue on an answer we cannot read.
              echo "paths-changed.sh returned '$mobile'; expected true or false" >&2
              exit 1
              ;;
          esac
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          if [ "$mobile" = "true" ]; then
            echo "Mobile, shared or Gradle sources changed — compiling and running the mobile tests." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No mobile, shared or Gradle sources changed — build and tests skipped, check reports green." >> "$GITHUB_STEP_SUMMARY"
          fi

      # NOT gated. It greps files off disk, costs about a second, and needs neither a JDK nor Gradle,
      # so there is no reason to buy an exception for it — and it means even the cheap path still
      # asserts something real about the repository.
      #
      # Compose Multiplatform is not Android. Its resource compiler (XmlValuesConverterTask) reads
      # getTextContent() straight off the DOM and base64-encodes it — there is no replace() call
      # anywhere in the task, and the runtime only substitutes %1$s-style arguments. So the Android
      # habit of writing \' for an apostrophe is never unescaped, and the backslash reaches the
      # screen. Fifteen strings shipped that way (#471): among them the invite text we send to
      # people who do not have the app yet, the two-step PIN screens, and the "this media may have
      # been tampered with" warning — every one a moment where the app is asking to be trusted.
      #
      # The check is "no backslash at all", not "no \'", because \n is not unescaped either: a line
      # break has to be written as a real line break. No backslash is legitimate in these files.
      #
      # Placed before the JDK and Gradle setup on purpose — it needs neither, so a regression fails
      # in seconds instead of after an Android build.
      - name: Reject Android-style escapes in Compose string resources
        run: |
          if grep -rnF '\' mobile/composeApp/src/commonMain/composeResources --include=strings.xml; then
            echo "ERROR: the string resource lines above contain a backslash." >&2
            echo "Compose Multiplatform resources do not unescape \\' — write the apostrophe directly." >&2
            echo "\\n is not unescaped either — use a real line break. See issue #471." >&2
            exit 1
          fi
          echo "OK: no backslashes in Compose string resources."

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: steps.changes.outputs.mobile == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.changes.outputs.mobile == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Inject stable debug keystore
        if: steps.changes.outputs.mobile == 'true'
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE }}" ]; then
            for dir in "${ANDROID_USER_HOME:-}" "$HOME/.android" "$HOME/.config/.android"; do
              [ -z "$dir" ] && continue
              mkdir -p "$dir"
              echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 --decode > "$dir/debug.keystore"
              echo "Wrote keystore to $dir/debug.keystore"
            done
          fi

      - name: Inject google-services.json
        if: steps.changes.outputs.mobile == 'true'
        run: |
          mkdir -p mobile/composeApp
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > mobile/composeApp/google-services.json
            echo "Using real google-services.json from secret"
          else
            cat > mobile/composeApp/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "muhabbet-ci-dummy",
              "storage_bucket": "muhabbet-ci-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.muhabbet.app" }
                },
                "api_key": [{ "current_key": "CI_DUMMY_KEY" }]
              }
            ],
            "configuration_version": "1"
          }
          GSEOF
            echo "WARNING: Using dummy google-services.json — Firebase Phone Auth will not work in this build"
          fi

      - name: Build shared module
        if: steps.changes.outputs.mobile == 'true'
        run: ./gradlew :shared:jvmJar :shared:assembleRelease

      # Static UI guardrails: string-resource sync across both locales, and the design-system
      # ratchet. Reads sources off disk, so it needs no Android SDK — hence SKIP_MOBILE.
      - name: Verify UI guardrails
        if: steps.changes.outputs.mobile == 'true'
        run: ./gradlew verifyUi
        env:
          SKIP_MOBILE: 'true'

      # Until now nothing in CI ran the mobile tests at all — including the WCAG contrast checks
      # that guard the palette. Not continue-on-error: a failure here should stop the build.
      #
      # The design-system tests run through `verifyRoborazziDebug`, which is `testDebugUnitTest`
      # with every `captureRoboImage` compared against its committed golden (#759): a component
      # whose pixels changed fails here, with the diff image uploaded below. Goldens are rendered by
      # Robolectric's native graphics on the JVM, so this needs no emulator.
      - name: Run mobile unit tests
        if: steps.changes.outputs.mobile == 'true' && inputs.record_goldens != true
        run: ./gradlew :mobile:designsystem:verifyRoborazziDebug :mobile:composeApp:testDebugUnitTest

      # Manual re-record, for an intended visual change: run the workflow with record_goldens,
      # download the artifact, and commit the PNGs it contains alongside the change that caused them.
      - name: Record screenshot goldens
        if: inputs.record_goldens == true
        run: ./gradlew :mobile:designsystem:recordRoborazziDebug

      - name: Upload recorded goldens
        if: inputs.record_goldens == true
        uses: actions/upload-artifact@v4
        with:
          name: designsystem-goldens
          path: mobile/designsystem/src/androidUnitTest/goldens/
          retention-days: 7

      - name: Upload screenshot diffs
        if: failure() && steps.changes.outputs.mobile == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: designsystem-screenshot-diffs
          path: mobile/designsystem/build/outputs/roborazzi/
          retention-days: 3

      # Uploading a report is a convenience, not a gate. It has failed the whole Android job on
      # "Artifact storage quota has been hit" — an account-level condition with nothing to do with
      # the code — and because the job stopped there, the APK build never ran and the run read as a
      # build failure. The tests themselves are the gate and fail the job at their own step.
      #
      # Uploads the XML rather than `reports/tests/`, which is a generated website of hundreds of
      # small files (#599). The XML is what any tool parses and is a fraction of the size, and it
      # is what `junit-summary.sh` renders straight into the step summary below — where it is
      # readable even on a day the artifact quota is full and this step uploads nothing.
      - name: Upload test results
        if: always() && steps.changes.outputs.mobile == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          # *.xml only: `test-results/` also holds Gradle's `binary/` event stream, which is the
          # bulk of the bytes and which nothing reads.
          path: |
            mobile/composeApp/build/test-results/*/*.xml
            mobile/designsystem/build/test-results/*/*.xml
          retention-days: 3

      # Same reasoning as Backend CI: the run page should say which tests failed without anyone
      # having to download an artifact, and the summary is not subject to the storage quota.
      - name: Summarise test results
        if: always() && steps.changes.outputs.mobile == 'true'
        run: |
          for d in mobile/composeApp/build/test-results/testDebugUnitTest \
                   mobile/designsystem/build/test-results/testDebugUnitTest; do
            echo "#### \`$d\`"
            bash .github/scripts/junit-summary.sh "$d"
          done >> "$GITHUB_STEP_SUMMARY"

      # #863: the tag -> version derivation, dry-run on every pull request. Mobile Release passes the
      # tag as muhabbet.versionName; this proves a tag resolves to that versionName and its computed
      # versionCode, and that the formula stays monotonic, without anyone having to cut a tag.
      - name: Dry-run the release version derivation
        if: steps.changes.outputs.mobile == 'true'
        run: |
          set -euo pipefail
          out=$(./gradlew -q :mobile:composeApp:verifyAppVersionScheme :mobile:composeApp:printAppVersion -Pmuhabbet.versionName=0.99.98)
          echo "$out"
          echo "$out" | grep -qx 'versionName=0.99.98 versionCode=9998' || {
            echo "::error::Tag v0.99.98 did not resolve to versionName 0.99.98 / versionCode 9998"; exit 1; }

      # The debug APK used to be skipped on a pull request into `dev`, the working branch, to spare
      # the ONE self-hosted runner (it is also the production host). It now runs: a pull request that
      # broke resource merging, manifest merging or androidMain compilation passed dev CI and broke
      # main. Incremental on the warm Gradle cache, it costs a few minutes (#865).
      - name: Build Android debug APK
        if: steps.changes.outputs.mobile == 'true'
        run: ./gradlew :mobile:composeApp:assembleDebug

      # Prints the certificate of the APK just built and nothing else. This step used to run
      # `find` across the production host's whole filesystem on every run and print the fingerprint
      # of every debug keystore it found there (#865).
      - name: Print APK signing certificate (register this in Firebase Console)
        if: steps.changes.outputs.mobile == 'true'
        continue-on-error: true
        run: |
          APK=$(find mobile/composeApp/build/outputs/apk/debug -name "*.apk" | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -n "$APK" ] && [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -i "SHA-1\|SHA-256\|certificate DN"
          fi

      # Blocking (#865). It ran with continue-on-error and no baseline, so a NewApi violation — the
      # class of bug that crashed voice transcription on Android 8-11 (#381) — was printed and
      # ignored. Findings that predate the gate are frozen in mobile/composeApp/lint-baseline.xml;
      # anything new fails here. NewApi and InlinedApi are errors (build.gradle.kts `lint {}`).
      - name: Run Android lint
        if: steps.changes.outputs.mobile == 'true'
        run: ./gradlew :mobile:composeApp:lintDebug

      - name: Upload lint results
        if: always() && steps.changes.outputs.mobile == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-results
          path: mobile/composeApp/build/reports/lint-results-*.html
          retention-days: 3

      # The minified build, on pull requests (#864). R8 ran only when a tag was cut, so a missing
      # keep rule became a release that crashed on launch — #633's failure class. `benchmark` is the
      # release build type signed with the debug key, so no keystore is needed here.
      # verifyBenchmarkArtifacts fails on a class reached by name that R8 removed, and on the APK
      # size budget; the measured size lands in the step summary.
      #
      # R8 is the most expensive step in this job and the runner is the production host, so on a
      # pull request into `dev` it runs only when something that changes R8's input changed: build
      # logic, keep rules or dependency versions. Into `main`, and on push, it always runs.
      - name: Decide whether the minified build is needed
        id: minified
        if: steps.changes.outputs.mobile == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$BASE_REF" != "dev" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          r8=$(bash .github/scripts/paths-changed.sh \
            mobile/composeApp/build.gradle.kts \
            mobile/composeApp/proguard-rules.pro \
            mobile/designsystem/build.gradle.kts \
            shared/build.gradle.kts \
            build.gradle.kts \
            settings.gradle.kts \
            gradle.properties \
            gradle/ \
            .github/workflows/mobile-ci.yml)
          echo "run=$r8" >> "$GITHUB_OUTPUT"

      - name: Build and verify the minified APK
        if: steps.minified.outputs.run == 'true'
        run: |
          set -euo pipefail
          ./gradlew :mobile:composeApp:assembleBenchmark :mobile:composeApp:verifyBenchmarkArtifacts | tee minified.log
          { echo "#### Minified APK (#864)"; grep -E '^benchmark APK:' minified.log; } >> "$GITHUB_STEP_SUMMARY"

      # ~128 MB a run. Twenty-six of these from February and March were still stored in August and
      # accounted for 3.10 GB of a 3.13 GB account total, which is what exhausted the artifact quota
      # and started failing this job. Retention is what keeps that from recurring; continue-on-error
      # is what keeps it from failing the build if it does.
      #
      # Cut from 7 days to 3 for #599. This artifact is, by the account's own numbers above, the
      # single largest consumer of the quota — everything else in this repository uploads reports
      # measured in kilobytes. A debug APK is reproducible from the commit in a few minutes, and
      # the release verification that actually matters installs the RELEASE APK from the GitHub
      # release on emulator-5554, never this one. Three days still covers "someone wants to try
      # the build from that PR" over a weekend.
      - name: Upload debug APK
        if: success() && github.base_ref != 'dev' && steps.changes.outputs.mobile == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: mobile/composeApp/build/outputs/apk/debug/*.apk
          retention-days: 3

  # --- iOS Framework Build ---
  #
  # Gated off by default, because it cannot run here. `macos-latest` is a GitHub-hosted runner and
  # this account has no macOS minutes available, so the job is allocated no runner and fails after
  # about three seconds with zero steps executed. That is not a build failure — nothing was built —
  # but it looked like one on every pull request into main, and since main requires a review rather
  # than passing checks, it was a permanent red mark that taught everyone to ignore red marks.
  #
  # It is skipped rather than `continue-on-error: true` deliberately. A job that always fails and is
  # always ignored is exactly how detekt's total breakage stayed invisible for months (see CLAUDE.md)
  # — an ignored failure and a real one look identical. A skipped job is honest: it says out loud
  # that iOS is not being checked.
  #
  # To turn it back on, set the repository variable ENABLE_MACOS_CI to 'true'
  # (Settings → Secrets and variables → Actions → Variables). Nothing else needs changing.
  ios-framework:
    name: iOS Framework Build
    if: vars.ENABLE_MACOS_CI == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Build shared iOS framework
        run: ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64
        env:
          SKIP_MOBILE: 'true'

      - name: Build CMP iOS framework
        run: ./gradlew :mobile:composeApp:linkReleaseFrameworkIosSimulatorArm64
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'
